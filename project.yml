# Alternative zum eingecheckten Danach.xcodeproj.
# Falls die Projektdatei einmal kaputtgeht oder ein Merge-Konflikt entsteht:
#
#   brew install xcodegen
#   xcodegen generate
#
# erzeugt ein frisches, gleichwertiges Projekt aus dieser Datei.

name: Danach
options:
  bundleIdPrefix: de.movingape
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: de
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES

targets:
  Danach:
    type: application
    platform: iOS
    sources:
      - path: Danach
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.movingape.danach
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Danach
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
